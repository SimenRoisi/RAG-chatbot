<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyComfort Airlines Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-scroll {
            scrollbar-width: thin;
            scrollbar-color: #0EA5E9 transparent;
        }

        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #0EA5E9;
            border-radius: 20px;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-sky-50 to-blue-100 h-screen flex flex-col items-center justify-center p-4">

    <!-- Auth screen removed - instant access -->

    <!-- Chat Interface -->
    <div id="chat-screen"
        class="flex flex-col w-full max-w-2xl bg-white rounded-xl shadow-2xl h-[80vh] overflow-hidden">

        <!-- Header -->
        <div class="bg-gradient-to-r from-sky-700 to-blue-800 p-4 text-white">
            <h1 class="font-bold text-lg flex items-center gap-2">✈️ SkyComfort Airlines Support</h1>
        </div>



        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll bg-slate-50">
            <!-- Messages go here -->
            <div class="flex justify-start">
                <div
                    class="bg-white border-2 border-sky-200 text-slate-800 p-4 rounded-tr-xl rounded-br-xl rounded-bl-xl shadow-sm max-w-[80%]">
                    <p class="font-semibold text-sky-700 mb-1">Welcome aboard! ✈️</p>
                    <p>I'm here to help with questions about baggage, check-in, special assistance, flight changes, and
                        more. How can I assist you today?</p>
                    <p class="text-xs text-slate-500 mt-2 italic">Try asking: "What's the carry-on weight limit?" or
                        "How do I check in online?"</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t">
            <form onsubmit="handleSend(event)" class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Ask about baggage, check-in, flights..."
                    class="flex-1 p-3 border-2 border-sky-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500"
                    autocomplete="off">
                <button type="submit"
                    class="bg-sky-600 text-white px-6 rounded-lg hover:bg-sky-700 transition font-medium">
                    Send
                </button>
            </form>
        </div>
    </div>

    <script>
        const BASE_URL = "";
        let messages = [];

        function appendMessage(role, text) {
            const container = document.getElementById("chat-messages");
            const div = document.createElement("div");
            div.className = `flex ${role === "user" ? "justify-end" : "justify-start"}`;

            const bubble = document.createElement("div");
            bubble.className = role === "user"
                ? "bg-sky-600 text-white p-3 rounded-tl-xl rounded-tr-xl rounded-bl-xl shadow-md max-w-[80%]"
                : "bg-white border-2 border-sky-100 text-slate-800 p-3 rounded-tr-xl rounded-br-xl rounded-bl-xl shadow-sm max-w-[80%]";

            bubble.innerText = text;
            div.appendChild(bubble);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById("chat-input");
            const text = input.value.trim();
            if (!text) return;

            // UI Update
            appendMessage("user", text);
            input.value = "";
            messages.push({ role: "user", content: text });

            // Loading state
            const loadingDiv = document.createElement("div");
            loadingDiv.id = "loading-bubble";
            loadingDiv.className = "flex justify-start";
            loadingDiv.innerHTML = '<div class="bg-gray-100 text-gray-500 p-3 rounded-xl text-sm italic">Thinking...</div>';
            document.getElementById("chat-messages").appendChild(loadingDiv);
            document.getElementById("chat-messages").scrollTop = document.getElementById("chat-messages").scrollHeight;

            try {
                const res = await fetch(`${BASE_URL}/assist`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ messages: messages })
                });

                document.getElementById("loading-bubble").remove();

                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();

                const reply = data.reply;
                appendMessage("assistant", reply);
                messages.push({ role: "assistant", content: reply });

            } catch (err) {
                document.getElementById("loading-bubble").remove();
                appendMessage("assistant", "Error: " + err.message);
            }
        }


    </script>
</body>

</html>
